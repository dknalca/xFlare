# Punto de partida para cualquier controlador con crossfader que emita MIDI.
# Usa el asistente para rellenar canal y CC reales.
[profile]
id       = generic-midi
name     = Controlador MIDI generico
vendor   = -
schema   = 1
revision = 1
author   = xFlare team
verified = false
notes    = Plantilla. Completar canal y CC con el asistente.

[match]

[audio]
samplerate     = 48000
output.main.ch = 1,2

[crossfader]
method       = midi
midi.channel = 1
midi.cc      = 0
midi.min     = 0
midi.max     = 127
midi.invert  = false
cut_in.left     = 0.05
cut_in.right    = 0.95
hysteresis      = 0.03
reverse_default = false
