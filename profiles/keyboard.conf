# Modo sin mesa. Permite usar xFlare sin ningun hardware.
[profile]
id       = keyboard
name     = Teclado (modo sin mesa)
vendor   = xFlare
schema   = 1
revision = 1
author   = xFlare team
verified = true
notes    = Para probar la app o practicar la lectura sin platos.

[match]

[audio]
samplerate     = 48000
output.main.ch = 1,2

[crossfader]
method          = none
cut_in.left     = 0.0
cut_in.right    = 1.0
hysteresis      = 0.0
reverse_default = false

[keyboard]
motion.forward = Right
motion.back    = Left
fader.toggle   = Space
