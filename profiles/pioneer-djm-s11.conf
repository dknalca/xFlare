# Pioneer DJM-S11
#
# AVISO: perfil SIN VERIFICAR. La S11 se comunica con Serato por HID y su
# implementacion no esta documentada publicamente. Tiene ademas un modo MIDI,
# pero no esta confirmado que exponga la posicion del crossfader.
# Estrategia por defecto: la misma que la Rane 72.

[profile]
id       = pioneer-djm-s11
name     = Pioneer DJM-S11
vendor   = Pioneer DJ
schema   = 1
revision = 1
author   = xFlare team
verified = false
notes    = Estructura propuesta. Requiere validacion con hardware.

[match]
midi.port    = *DJM-S11*
audio.device = *DJM-S11*

[audio]
samplerate        = 48000
buffer.frames     = 64
timecode.deck1.ch = 3,4
timecode.deck2.ch = 5,6
output.main.ch    = 1,2
return.ch         = 7,8

[crossfader]
method          = audio_return
pilot.frequency = 19500
pilot.level_db  = -40
cut_in.left     = 0.05
cut_in.right    = 0.95
hysteresis      = 0.03
reverse_default = true

[quirks]
hid_serato_mode = true
text = Comprobar si en modo MIDI (no Serato) la mesa emite CC del crossfader. Si lo hace, cambiar method a midi.
