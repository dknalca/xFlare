# Rane Seventy-Two (MK1) — hardware de referencia de xFlare
#
# AVISO: perfil parcialmente verificado. El metodo de captura del crossfader
# y el canal del timecode del deck 1 SI estan confirmados contra el aparato
# (ver mas abajo). El resto de canales de audio (deck2, return) siguen siendo
# hipotesis razonadas, no medidas.
#
# Hallazgo (2026-09-04, cierra B5.5): con vinilo Serato CV02 real girando, el
# canal `timecode.deck1.ch` asumido (3,4) NO enganchaba, ni ningun otro de los
# 7 pares posibles de los 14 canales de entrada de la mesa (se probaron todos).
# El medidor de la propia Rane si se movia con el plato, asi que la señal
# llegaba a la mesa pero no dabamos con el canal USB correcto. Se resolvio
# consultando los NOMBRES de canal que la propia Rane 72 reporta por CoreAudio
# (kAudioObjectPropertyElementName): 1-2 "Analog 1", 3-4 "Analog 2", 5-6
# "Mix", 7-8 "Deck 1", 9-10 "Deck 2", 11-12 "Session In", 13-14 "Mic 1/2".
# Contraintuitivo: el canal literalmente etiquetado "Deck 1" (7-8) NO lleva la
# señal real (solo un pico aislado de confianza, probablemente falso
# enganche); la señal real esta en "Analog 1" (1-2), confirmado tambien en
# Ableton Live de forma independiente. 60s a 33 1/3: vel media 0.9999,
# conf sostenida 0.92-1.00, engancho bitstream SI. Direccion y dropout
# tambien confirmados (ver docs/TIMECODE.md §3). deck2.ch y return.ch de
# abajo NO estan verificados asi: son la MISMA hipotesis (el patron "Analog N"
# en vez de la etiqueta "Deck N"/"Mix"), pendiente de probar con el aparato.
#
# Hallazgo (2026-09-03, corrige ADR-021): con el aparato conectado por USB se
# monitorizo CoreMIDI moviendo SOLO el crossfader, en aislamiento, durante 5
# minutos confirmados en vivo: 15313 de 15317 mensajes fueron Control Change
# 8 en canal MIDI 16 (los 4 restantes, ruido de un roce accidental al fader
# de canal). La suposicion original de ADR-021 ("la mesa no expone el
# crossfader por MIDI") era incorrecta para este aparato: el MAG FOUR SI
# manda su posicion por MIDI CC. Por eso method = midi pasa a ser el
# metodo primario; audio_return queda documentado como respaldo (bloque
# comentado mas abajo) para mesas que de verdad no lo expongan.
# Pendiente de confirmar con el aparato: los extremos exactos del barrido
# (0 y 127 en los topes) y el sentido (invert) — se resuelve en el asistente
# de calibracion. Hasta entonces cut_in/hysteresis/reverse_default son punto
# de partida, no datos medidos.

[profile]
id       = rane-seventy-two
name     = Rane Seventy-Two
vendor   = Rane
schema   = 1
revision = 1
author   = xFlare team
verified = true
notes    = Verificado contra el aparato fisico (2026-09): timecode del deck1 (canal "Analog 1"), crossfader por MIDI CC8/canal16, y calibracion del fader confirmados con vinilo real. deck2.ch/return.ch siguen siendo hipotesis por patron de nombre, sin probar con audio real (ver cabecera del fichero).

[match]
midi.port    = *Seventy-Two*
audio.device = *Seventy-Two*

[audio]
samplerate        = 48000
buffer.frames     = 64
# deck1.ch confirmado 2026-09-04 con vinilo real (B5.5): es el canal "Analog 1".
# deck2.ch es hipotesis por el mismo patron ("Analog 2"), SIN probar con el deck 2.
# return.ch es hipotesis por nombre de canal ("Mix"), SIN verificar con audio real.
timecode.deck1.ch = 1,2
timecode.deck2.ch = 3,4
output.main.ch    = 1,2
return.ch         = 5,6

[crossfader]
method          = midi
midi.channel    = 16
midi.cc         = 8
midi.min        = 0
midi.max        = 127
midi.invert     = false
cut_in.left     = 0.05
cut_in.right    = 0.95
hysteresis      = 0.03
reverse_default = true
# Respaldo 1: tono piloto sobre el retorno de audio (ADR-021, metodo original
# antes de confirmar que el crossfader si manda MIDI). Para activarlo:
# method = audio_return.
# pilot.frequency = 19500
# pilot.level_db  = -40
# Respaldo 2: la Rane 72 tambien habla HID con Serato. Rellenar los valores
# leyendo el descriptor HID del aparato (asistente de calibracion, o
# `ioreg -p IOUSB` / `hidutil`). Para activarlo: method = hid.
# hid.vendor_id   = 0x13e5
# hid.product_id  = 0x0000
# hid.report_id   = 0
# hid.byte_offset = 0
# hid.byte_length = 2
# hid.min = 0
# hid.max = 1023
# hid.invert = false

[linefader.deck1]
method = none

# Comandos de practica por MIDI (ver docs/DEVICE_PROFILES.md 3). SIN VERIFICAR:
# la Rane 72 orienta su MIDI a pads y Serato; estos numeros son un punto de
# partida para los 8 pads performance. Descomentar y ajustar con el aparato.
# El usuario puede pisar cualquiera desde Ajustes -> MIDI - comandos.
# [transport]
# command.cue           = note:1:0x14
# command.restart_base  = note:1:0x15
# command.freeze        = note:1:0x16
# command.record        = note:1:0x17
# command.bpm_up        = note:1:0x18
# command.bpm_down      = note:1:0x19
# command.fader         = note:1:0x1A
# command.metronome     = note:1:0x1B
# command.call_response  = note:1:0x1C

[quirks]
crossfader_sends_midi_cc = true
requires_usb_return = false
text = Confirmado 2026-09-03: el crossfader manda CC8/canal16 por MIDI (ver cabecera). El contour del crossfader afecta a la deteccion visual/tactil pero no al CC; calibrar de todas formas con el contour en la posicion de uso real, por si acaso el barrido no es lineal en los extremos.
