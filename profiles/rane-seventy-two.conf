# Rane Seventy-Two (MK1) — hardware de referencia de xFlare
#
# AVISO: perfil SIN VERIFICAR. Los canales de audio y los numeros MIDI son
# suposiciones razonables, no datos confirmados contra el aparato.
#
# Hallazgo importante que motiva method = audio_return:
#   El crossfader MAG FOUR es un componente de audio por hardware. La mesa NO
#   parece exponer su posicion por MIDI a software de terceros; su mapeo MIDI
#   esta orientado a pads y a Serato. Por eso la estrategia por defecto es
#   capturar el retorno del master por USB y detectar un tono piloto inaudible.
#   VALIDAR EN EL BLOQUE B1 antes de construir nada encima.

[profile]
id       = rane-seventy-two
name     = Rane Seventy-Two
vendor   = Rane
schema   = 1
revision = 1
author   = xFlare team
verified = false
notes    = Estructura propuesta. Requiere validacion con hardware.

[match]
midi.port    = *Seventy-Two*
audio.device = *Seventy-Two*

[audio]
samplerate        = 48000
buffer.frames     = 64
timecode.deck1.ch = 3,4
timecode.deck2.ch = 5,6
output.main.ch    = 1,2
return.ch         = 7,8

[crossfader]
method          = audio_return
pilot.frequency = 19500
pilot.level_db  = -40
cut_in.left     = 0.05
cut_in.right    = 0.95
hysteresis      = 0.03
reverse_default = true
# Respaldo si el retorno de audio no funciona: la Rane 72 habla HID con Serato.
# Rellenar los valores leyendo el descriptor HID del aparato (asistente de
# calibracion, o `ioreg -p IOUSB` / `hidutil`). Para activarlo: method = hid.
# hid.vendor_id   = 0x13e5
# hid.product_id  = 0x0000
# hid.report_id   = 0
# hid.byte_offset = 0
# hid.byte_length = 2
# hid.min = 0
# hid.max = 1023
# hid.invert = false

[linefader.deck1]
method = none

[quirks]
crossfader_no_midi = true
requires_usb_return = true
text = El contour del crossfader afecta a la deteccion; calibrar con el contour en la posicion de uso real.
